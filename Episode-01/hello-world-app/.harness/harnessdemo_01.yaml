pipeline:
  id: harnessdemo_01
  name: harnessdemo_01
  description: Simple hello world pipeline that prints a greeting.
  tags:
    ai_generated: ""
  stages:
    - name: hello
      steps:
        - run:
            script: echo "hello world"
    - id: javaMavenBuildTestHostedLinuxStage_1
      name: Java Maven Build and Test on Harness Cloud (Linux)
      clone:
        enabled: true
      cache:
        enabled: true
      build-intelligence:
        enabled: true
      steps:
        - id: setupJava
          name: Setup Java
          template:
            uses: setupJava@1.0.0
        - id: buildLinux
          name: Build on Linux
          run:
            shell: bash
            script: mvn -B -DskipTests package
        - infrastructure:
            uses: blastRadiusAgent
